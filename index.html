<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Inspectra – Surveillance</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mute:#94a3b8;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444; --info:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  main{max-width:520px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
  h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
  .ver{font-size:12px;font-weight:500;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 6px;vertical-align:3px;margin-left:4px}
  h2{font-size:13px;margin:0 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px;font-weight:500}
  .pill{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--line);color:var(--txt);white-space:nowrap}
  .pill::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mute);vertical-align:1px}
  .pill.connected::before{background:var(--ok)}
  .pill.connecting::before,.pill.reconnecting::before,.pill.searching::before{background:var(--warn);animation:blink 1s infinite}
  .pill.failed::before{background:var(--bad)}
  @keyframes blink{50%{opacity:.25}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .main{text-align:center;padding:22px 16px 18px;transition:border-color .2s}
  .main.alarm{border-color:var(--bad);box-shadow:0 0 0 2px rgba(239,68,68,.35) inset}
  .lbl{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.8px}
  .conc{font-size:80px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;margin:10px 0 2px;transition:color .2s,opacity .2s}
  .conc.zero{color:var(--ok)} .conc.pos{color:var(--warn)} .conc.alarm{color:var(--bad)}
  .conc.idle{opacity:.35}
  .unit{font-size:16px;color:var(--mute)}
  .trigger{margin-top:12px;font-size:14px;color:var(--mute)}
  .trigger b{color:var(--txt)}
  .trigger.on b{color:var(--ok)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .grid .card{margin:0}
  .val{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:6px}
  .val small{font-size:13px;color:var(--mute);font-weight:400}
  .alarmbadge{display:inline-block;margin-top:8px;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--line);color:var(--mute)}
  .alarmbadge.on{background:var(--bad);color:#fff}
  .bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin-top:10px}
  .bars i{flex:1;background:var(--line);border-radius:2px}
  .pumprow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .pumprow .val{font-size:22px}
  .pumpbtns{display:flex;gap:8px;margin-top:12px}
  .pumpbtns button{font-size:15px;padding:12px 6px}
  .pumpbtns button.on{outline:2px solid var(--info);outline-offset:1px}
  canvas{width:100%;height:170px;display:block;margin-top:8px;touch-action:pan-y;cursor:crosshair}
  .chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #btnLive{background:var(--line);color:var(--mute)}
  #btnLive.on{background:var(--bad);color:#fff}
  #chartSlider{width:100%;margin:10px 0 4px;accent-color:var(--info)}
  .zooms{display:flex;gap:6px}
  .zooms button{flex:1}
  .zooms button.on{background:var(--info);color:#0f172a}
  #chartInfo b{color:var(--txt)}
  .leaflet-tooltip.curtip{font-weight:600}

  .btns{display:flex;gap:10px;margin:12px 0}
  button{flex:1;font:inherit;font-size:16px;font-weight:600;padding:14px;border-radius:12px;border:0;cursor:pointer;color:#0f172a;background:var(--info)}
  button.sec{background:var(--line);color:var(--txt)}
  button.go{background:var(--ok);color:#052e16}
  button.danger{background:var(--bad);color:#fff}
  button.small{flex:0 0 auto;font-size:13px;padding:8px 12px;border-radius:9px}
  button.link{background:transparent;color:var(--info);font-size:13px;font-weight:500;padding:4px;flex:0 0 auto;text-decoration:underline}
  button:disabled{opacity:.35;animation:none!important}
  button.pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}70%{box-shadow:0 0 0 14px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .full{width:100%;display:block}

  .mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
  .mhead b{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec{color:var(--bad);font-size:13px;white-space:nowrap}
  .rec::before{content:"● ";animation:blink 1.4s infinite}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;text-align:center;margin-bottom:10px}
  .stats div{background:var(--bg);border-radius:10px;padding:8px 2px}
  .stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
  .stats span{font-size:11px;color:var(--mute)}
  .hint{font-size:13px;color:var(--mute);line-height:1.5;margin:8px 0 0}
  .hint.bad{color:#fca5a5}

  .info{font-size:13px;color:var(--mute);line-height:1.6}
  .info b{color:var(--txt);font-weight:500}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:10px 12px}
  .item .grow{flex:1;min-width:0}
  .item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .s{font-size:12px;color:var(--mute);margin-top:2px}
  .x{background:transparent;color:var(--mute);font-size:20px;padding:4px 8px;flex:0 0 auto}
  .empty{font-size:13px;color:var(--mute)}
  details{font-size:12px}
  summary{cursor:pointer;color:var(--mute);font-size:13px}
  #log{font-family:ui-monospace,Consolas,monospace;white-space:pre-wrap;max-height:220px;overflow:auto;margin:8px 0 0;color:#cbd5e1}
  .warnbox{background:#422006;border:1px solid #a16207;color:#fde68a;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px;display:none}

  .modal{position:fixed;inset:0;background:rgba(2,6,23,.7);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .modal[hidden]{display:none}
  .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
  .sheet h3{margin:0 0 14px;font-size:19px}
  label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
  input,textarea{width:100%;font:inherit;font-size:16px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
  input.err{border-color:var(--bad)}
  textarea{min-height:90px;resize:vertical}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;background:var(--bg);border-radius:12px;padding:12px}
  .kv span{color:var(--mute)} .kv b{font-weight:600;font-variant-numeric:tabular-nums;word-break:break-word}
  .kv b.hot{color:var(--bad)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .thumbs div{position:relative;width:92px;height:92px}
  .thumbs img{width:100%;height:100%;object-fit:cover;border-radius:10px}
  .thumbs button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;padding:0;border-radius:50%;background:var(--bad);color:#fff;font-size:15px;line-height:26px}
  .file{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--line);border-radius:12px;padding:13px;font-weight:600;cursor:pointer;margin-top:4px;color:var(--txt)}
  .file input{display:none}

  #map{height:320px;border-radius:12px;overflow:hidden;background:#cbd5e1;z-index:0}
  .mapoff{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#334155;font-size:14px}
  .leaflet-marker-icon.pin{background:#dc2626;border:2.5px solid #fff;border-radius:50%;color:#fff;font:700 13px/23px system-ui;text-align:center;box-sizing:border-box;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .leaflet-marker-icon.pin.annot{background:#2563eb;font-size:11px}
  .mapshown[hidden]{display:none}
  .mapshown{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin:-4px 0 8px}
  .mapshown b{color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #btnLocate.on{background:#1e3a8a;color:#bfdbfe}
  .leaflet-container{font-family:inherit}
  .setrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin-top:12px;font-size:13px;color:var(--mute)}
  select{font:inherit;font-size:14px;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 8px;width:100%}
  /* ===== Visual_Concentration : affichage paysage (début) ===== */
  body.vc-on{overflow:hidden}
  #vcView{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);border:5px solid transparent;transition:background .2s,border-color .2s}
  #vcView[hidden]{display:none}
  #vcView.alarm{border-color:var(--bad);background:#2a0f14}
  /* mode chiffre */
  #vcBig{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .vc-conc{font-size:min(44vh,21vw);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;transition:color .2s,opacity .2s}
  .vc-conc.zero{color:var(--ok)} .vc-conc.pos{color:var(--warn)} .vc-conc.alarm{color:var(--bad)} .vc-conc.idle{opacity:.35}
  .vc-unit{font-size:6vh;color:var(--mute);margin-top:1vh}
  .vc-info{font-size:4.6vh;color:var(--mute);margin-top:3vh;text-align:center}
  .vc-info b{color:var(--txt)}
  /* mode carte : la carte de la page est déplacée ici en plein écran */
  #vcMapHolder{display:none}
  #vcView.vc-map #vcBig{display:none}
  #vcView.vc-map #vcMapHolder{display:block;position:absolute;inset:0;z-index:0}
  #vcView.vc-map #vcMapHolder #map{width:100%;height:100%;border-radius:0}
  #vcView.vc-map .leaflet-top.leaflet-left{top:60px}   /* décale le zoom pour ne pas être caché par le bouton */
  /* panneau concentration en transparence par-dessus la carte */
  #vcPanel{display:none}
  #vcView.vc-map #vcPanel{display:block;position:absolute;left:14px;bottom:14px;z-index:5;pointer-events:none;
    background:rgba(15,23,42,.62);border:1px solid var(--line);border-radius:14px;padding:10px 16px 12px}
  #vcView.vc-map.alarm #vcPanel{background:rgba(153,27,27,.72)}
  .vcp-conc{font-size:min(24vh,15vw);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 8px rgba(0,0,0,.6);transition:color .2s,opacity .2s}
  .vcp-conc.zero{color:#86efac} .vcp-conc.pos{color:#fcd34d} .vcp-conc.alarm{color:#fecaca} .vcp-conc.idle{opacity:.45}
  .vcp-unit{font-size:3vh;color:#cbd5e1;margin-top:2px}
  .vcp-info{font-size:2.6vh;color:#e2e8f0;margin-top:4px}
  .vcp-info b{color:#fff}
  /* boutons du plein écran */
  #vcMin{position:absolute;top:14px;right:14px;z-index:6}
  #vcMap{position:absolute;top:14px;left:14px;z-index:6}
  #vcPump{position:absolute;top:56px;right:14px;z-index:6}
  #vcLocate{position:absolute;right:14px;bottom:16px;z-index:6}
  #vcLocate[hidden]{display:none}
  #vcOpen{position:fixed;right:14px;bottom:14px;z-index:5;box-shadow:0 2px 12px rgba(0,0,0,.5)}
  #vcOpen[hidden]{display:none}
  /* ===== Visual_Concentration (fin) ===== */
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous"></script>
</head>
<body>
<main>
  <header>
    <h1>Inspectra <span id="appVersion" class="ver"></span></h1>
    <span id="state" class="pill"></span>
  </header>

  <div id="support" class="warnbox"></div>

  <!-- Mesure -->
  <section id="mainCard" class="card main">
    <div class="lbl" data-i18n="concentration"></div>
    <div id="conc" class="conc idle">—</div>
    <div class="unit" id="unit"></div>
    <div id="measState" class="trigger"></div>
  </section>

  <!-- Surveillance -->
  <section class="card" id="missionCard">
    <div id="missionIdle">
      <button id="btnStart" class="go full" data-i18n="start"></button>
      <p class="hint" id="startHint"></p>
    </div>
    <div id="missionActive" hidden>
      <div class="mhead"><b id="mName"></b><span class="rec" data-i18n="recording"></span></div>
      <div class="stats">
        <div><b id="sDur">0:00</b><span data-i18n="duration"></span></div>
        <div><b id="sDist">0 m</b><span data-i18n="distance"></span></div>
        <div><b id="sAlarms">0</b><span data-i18n="alarms"></span></div>
        <div><b id="sIndices">0</b><span data-i18n="indices"></span></div>
        <div><b id="sAnnots">0</b><span data-i18n="annotShort"></span></div>
      </div>
      <button id="btnIndice" class="danger full" disabled></button>
      <button id="btnAnnot" class="sec full" style="margin-top:8px" data-i18n="annotation"></button>
      <p class="hint" id="gpsHint" data-i18n="gpsWaiting"></p>
      <div class="btns" style="margin-bottom:0"><button id="btnStop" class="sec" data-i18n="stop"></button></div>
    </div>
  </section>

  <!-- Carte -->
  <section class="card" id="mapCard">
    <div id="mapShown" class="mapshown" hidden><span data-i18n="mapShown"></span> <b id="mapShownName"></b><button class="x" id="btnMapClose" data-i18n-title="backToMe">×</button></div>
    <div id="map"></div>
    <div class="btns" style="margin-bottom:0"><button id="btnLocate" class="sec"></button></div>
    <p class="hint" id="mapHint" data-i18n="mapHint"></p>
  </section>

  <!-- Courbe des mesures -->
  <section class="card" id="chartCard">
    <div class="chead"><div class="lbl" id="chartTitle" data-i18n="history"></div><button id="btnLive" class="small" data-i18n="chartLive"></button></div>
    <canvas id="chart"></canvas>
    <input type="range" id="chartSlider" min="0" max="1000" value="1000">
    <div class="zooms">
      <button class="small sec" data-span="60000">1 min</button>
      <button class="small sec" data-span="300000">5 min</button>
      <button class="small sec" data-span="900000">15 min</button>
      <button class="small sec" data-span="0" data-i18n="chartAll"></button>
    </div>
    <p class="hint" id="chartInfo" data-i18n="chartHint"></p>
  </section>

  <div class="grid">
    <section class="card">
      <div class="lbl" data-i18n="max"></div>
      <div class="val" id="max">—</div>
      <span id="alarm" class="alarmbadge"></span>
    </section>
    <section class="card">
      <div class="lbl" data-i18n="battery"></div>
      <div class="val" id="bat">—</div>
      <div class="bars" id="batBars"></div>
    </section>
  </div>

  <!-- Pompe -->
  <section class="card">
    <div class="pumprow"><div class="lbl" data-i18n="pump"></div><div class="val" id="pump">—</div></div>
    <div class="pumpbtns">
      <button class="sec" data-pump="0000" data-i18n="pumpStop"></button>
      <button class="sec" data-pump="0100" data-i18n="pumpL1"></button>
      <button class="sec" data-pump="0101" data-i18n="pumpL2"></button>
    </div>
    <p class="hint" data-i18n="pumpHint"></p>
  </section>

  <!-- Indices et annotations de la mission affichée -->
  <section class="card" id="itemsCard" hidden>
    <h2 id="itemsTitle"></h2>
    <div class="list" id="itemsList"></div>
  </section>

  <!-- Connexion -->
  <div class="btns" style="margin-bottom:4px">
    <button id="btnConnect" data-i18n="connect"></button>
    <button id="btnDisconnect" class="sec" disabled data-i18n="disconnect"></button>
  </div>
  <div class="btns" style="margin-bottom:4px"><button id="btnShutdown" class="danger" disabled data-i18n="shutdown"></button></div>
  <div style="text-align:center;margin-bottom:12px"><button id="btnConnectAll" class="link" data-i18n="connectAll"></button></div>

  <section class="card info" id="devinfo" data-i18n="noDevice"></section>

  <section class="card">
    <h2 data-i18n="knownDevices"></h2>
    <div class="list" id="devList"></div>
  </section>

  <section class="card">
    <h2 data-i18n="missions"></h2>
    <div class="list" id="missionList"></div>
  </section>

  <section class="card">
    <details>
      <summary data-i18n="log"></summary>
      <div id="log"></div>
    </details>
    <div class="setrow">
      <label for="modeSel" data-i18n="mode" style="margin:0"></label><select id="modeSel"></select>
      <label for="langSel" data-i18n="language" style="margin:0"></label><select id="langSel"></select>
    </div>
    <div class="btns" style="margin-bottom:0"><button id="btnDemo" class="sec small"></button></div>
  </section>
</main>

<!-- ===== Visual_Concentration : affichage paysage (début) ===== -->
<div id="vcView" hidden>
  <div id="vcMapHolder"></div>
  <div id="vcBig">
    <div id="vcConc" class="vc-conc">—</div>
    <div class="vc-unit" id="vcUnit"></div>
    <div class="vc-info" id="vcInfo"></div>
  </div>
  <div id="vcPanel">
    <div id="vcpConc" class="vcp-conc">—</div>
    <div class="vcp-unit" id="vcpUnit"></div>
    <div class="vcp-info" id="vcpInfo"></div>
  </div>
  <button id="vcMin" class="sec small" data-i18n="vc.minimize"></button>
  <button id="vcMap" class="sec small"></button>
  <button id="vcLocate" class="sec small" hidden></button>
  <button id="vcPump" class="sec small"></button>
</div>
<button id="vcOpen" class="small" hidden data-i18n="vc.open"></button>
<!-- ===== Visual_Concentration (fin) ===== -->

<!-- Démarrage de mission -->
<div class="modal" id="dlgStart" hidden>
  <div class="sheet">
    <h3 data-i18n="newMission"></h3>
    <label for="fName" data-i18n="missionName"></label>
    <input id="fName" data-i18n-ph="missionNamePh">
    <label for="fOp" data-i18n="operator"></label>
    <input id="fOp" data-i18n-ph="operatorPh">
    <label for="fThr"><span data-i18n="threshold"></span> (<span class="u"></span>) *</label>
    <input id="fThr" type="number" inputmode="decimal" min="0" step="any" data-i18n-ph="thresholdPh">
    <p class="hint" id="thrHelp" data-i18n="thresholdHelp"></p>
    <div class="btns"><button class="sec" data-close data-i18n="cancel"></button><button class="go" id="btnStartOk" data-i18n="startOk"></button></div>
  </div>
</div>

<!-- Indice -->
<div class="modal" id="dlgIndice" hidden>
  <div class="sheet">
    <h3 id="iTitle"></h3>
    <div class="kv">
      <span data-i18n="time"></span><b id="iTime"></b>
      <span data-i18n="concentration"></span><b id="iConc" class="hot"></b>
      <span data-i18n="position"></span><b id="iPos"></b>
    </div>
    <div class="btns"><button class="sec small" id="btnPosNow" data-i18n="useMyPos"></button></div>
    <label for="iNote" data-i18n="note"></label>
    <textarea id="iNote" data-i18n-ph="notePh"></textarea>
    <label data-i18n="photos"></label>
    <label class="file"><span data-i18n="addPhoto"></span><input id="iPhoto" type="file" accept="image/*" capture="environment"></label>
    <div class="thumbs" id="iThumbs"></div>
    <div class="btns"><button class="sec" data-close data-i18n="cancel"></button><button class="danger" id="btnIndiceOk" data-i18n="saveIndice"></button></div>
  </div>
</div>

<!-- Annotation (point à la demande, différent d'un indice) -->
<div class="modal" id="dlgAnnot" hidden>
  <div class="sheet">
    <h3 id="aTitle"></h3>
    <div class="kv">
      <span data-i18n="time"></span><b id="aTime"></b>
      <span data-i18n="position"></span><b id="aPos"></b>
    </div>
    <div class="btns"><button class="sec small" id="btnAPosNow" data-i18n="useMyPos"></button></div>
    <label for="aNote" data-i18n="note"></label>
    <textarea id="aNote" data-i18n-ph="notePh"></textarea>
    <label data-i18n="photos"></label>
    <label class="file"><span data-i18n="addPhoto"></span><input id="aPhoto" type="file" accept="image/*" capture="environment"></label>
    <div class="thumbs" id="aThumbs"></div>

const APP_DATE = '17/11/2026';
const UNIT = 'ppm';                // unité de l'Inspectra (valeur reçue × 0,1 comme dans le C#)

/* =====================================================================

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n === null || n === undefined ? '—' : Number(n).toLocaleString(LOCALE, { maximumFractionDigits: 1 });
const fmtDate = t => new Date(t).toLocaleString(LOCALE, {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const fmtTime = t => new Date(t).toLocaleTimeString(LOCALE);
const fmtDur = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h} h ${String(m).padStart(2,'0')}` : `${m}:${String(s % 60).padStart(2,'0')}`; };
const fmtDurLong = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return (h ? h + ' h ' : '') + m + ' min ' + (s % 60) + ' s'; };
const fmtDist = m => m < 1000 ? Math.round(m) + ' m' : (m / 1000).toLocaleString(LOCALE, { maximumFractionDigits: 2 }) + ' km';
const fmtPos = p => p ? `${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}` : t('unavailable');
const mapUrl = p => `https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lon.toFixed(6)}`;
function hav(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const trackDist = tr => tr.reduce((d, p, i) => i ? d + hav(tr[i - 1], p) : 0, 0);

function log(msg) {
  const el = $('log');
  el.textContent = `[${fmtTime(Date.now())}] ${msg}\n` + el.textContent.split('\n').slice(0, 150).join('\n');
}
function openModal(id) { $(id).hidden = false; }
function closeModal(id) { $(id).hidden = true; }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(b.closest('.modal').id));

/* =====================================================================
   Stockage : appareils (localStorage) et missions (IndexedDB)
   Clés préfixées « insp_ » : pas de mélange avec le Gazoscan s'ils sont
   hébergés sur le même compte GitHub (même origine).
   ===================================================================== */
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const db = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => {
    const r = indexedDB.open('inspectra', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('missions', { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const tx = async (mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction('missions', mode), r = fn(t.objectStore('missions'));
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    put: m => tx('readwrite', s => s.put(m)),
    get: id => tx('readonly', s => s.get(id)),
    all: () => tx('readonly', s => s.getAll()),
    del: id => tx('readwrite', s => s.delete(id))
  };
})();

   ===================================================================== */
// Fusionne deux entrées du même appareil (b dans a) : garder le plus récent,
// additionner les connexions, conserver n° de série et firmware.
function mergeDev(a, b) {
  a.count = (a.count || 0) + (b.count || 0);
  a.serial = a.serial || b.serial;
  a.fw = a.fw || b.fw;
  if ((b.last || 0) > (a.last || 0)) { a.last = b.last; a.name = b.name || a.name; a.id = b.id; }
  else { a.name = a.name || b.name; }
  return a;
}
// Regroupe les doublons déjà enregistrés : même n° de série, sinon même nom Bluetooth.
function dedupDevices(list) {
  const seen = {};
  for (const d of Object.values(list)) {
    const k = d.serial ? 's:' + d.serial : (d.name ? 'n:' + d.name : 'id:' + d.id);
    if (!seen[k]) seen[k] = { ...d };
    else mergeDev(seen[k], d);
  }
  const out = {};
  for (const k in seen) out[seen[k].id] = seen[k];
  return out;
}
function rememberDevice(extra) {
  if (!device) return;
  const list = store.get('insp_devices', {});
  const serial = insp.serial || (extra && extra.serial) || '';
  let e = list[device.id];
  if (!e) {
    // Chrome peut donner un NOUVEL identifiant au même appareil : retrouver l'entrée
    // existante (par n° de série en priorité, sinon par nom) et la reprendre sous le nouvel id.
    const name = device.name || '';
    const prev = Object.keys(list).find(k => k !== device.id &&
      (serial ? list[k].serial === serial : (name && list[k].name === name)));
    if (prev) { e = list[prev]; delete list[prev]; } else e = { count: 0 };
    e.id = device.id;
  }
  e.name = device.name || e.name || t('unnamed');
  if (extra) Object.assign(e, extra);
  else { e.last = Date.now(); e.count = (e.count || 0) + 1; }
  list[device.id] = e;
  store.set('insp_devices', dedupDevices(list));
  renderDevices();
}
function renderDevices() {
  let raw = store.get('insp_devices', {});
  const deduped = dedupDevices(raw);
  if (Object.keys(deduped).length !== Object.keys(raw).length) { store.set('insp_devices', deduped); }   // réenregistre si la liste a changé
  const list = Object.values(deduped).sort((a, b) => (b.last || 0) - (a.last || 0));
  const el = $('devList');
  if (!list.length) { el.innerHTML = `<div class="empty">${t('noKnown')}</div>`; return; }
  el.innerHTML = list.map(d => `
    <div class="item">
      <div class="grow">
        <div class="t">${esc(d.name)}</div>
        <div class="s">${d.serial ? `${esc(t('dev.Série'))} ${esc(d.serial)} · ` : ''}${t('lastConn', { d: fmtDate(d.last) })}${d.count ? ` · ${t('connCount', { n: d.count })}` : ''}</div>
      </div>
      <button class="small" data-dev="${esc(d.id)}">${t('connect')}</button>
      <button class="x" data-forget="${esc(d.id)}" title="${t('forget')}">×</button>
    </div>`).join('');
  el.querySelectorAll('[data-dev]').forEach(b => {
    b.disabled = isBusy() || !navigator.bluetooth;
    b.onclick = () => connectKnown(store.get('insp_devices', {})[b.dataset.dev]);

  el.querySelectorAll('[data-forget]').forEach(b => b.onclick = () => {
    const l = store.get('insp_devices', {}); delete l[b.dataset.forget]; store.set('insp_devices', l); renderDevices();
  });
}

   Connexion BLE (service BGX ou NINA, comme Inspectra_Ble_Connection)
   ===================================================================== */
const optionalServices = [...UARTS.map(u => u.svc), 'device_information'];

async function requestDevice(opts) {
  setState('searching');
  try {
    useDevice(await navigator.bluetooth.requestDevice({ ...opts, optionalServices }));
  } catch (e) {
    log(t('logSelCancel', { e: e.message }));
    setState('idle');
  }
}

async function connectKnown(entry) {
  if (!entry) return;
  if (navigator.bluetooth.getDevices) {
    try {
      // Reconnexion sans sélecteur : retrouver l'appareil déjà autorisé par id, sinon par nom
      // (Chrome peut avoir réattribué un nouvel id au même appareil).
      const devs = await navigator.bluetooth.getDevices();
      const d = devs.find(x => x.id === entry.id) || (entry.name && devs.find(x => x.name === entry.name));
      if (d) { log(t('logKnown')); useDevice(d); return; }
    } catch {}
  }
  requestDevice({ filters: [{ name: entry.name }] });
}

function useDevice(d) {
  device = d;
  log(t('logDevice', { n: device.name || t('unnamed'), id: device.id }));
  device.removeEventListener('gattserverdisconnected', onDisconnected);
  device.addEventListener('gattserverdisconnected', onDisconnected);
  userDisconnect = false;
  reconnectDelay = 1000;
  notifyChar = null;
  insp.serial = ''; insp.battery = null; insp.pump = null;
  connect();
}

const withTimeout = (p, ms, what) =>
  Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(t('timeout', { w: what }))), ms))]);

async function connect() {
  if (!device) return;
  clearTimeout(reconnectTimer);
  const first = !notifyChar;
  setState(first ? 'connecting' : 'reconnecting');
  try {
    startRssi();   // écoute les publicités avant la connexion : plus de chances d'obtenir un RSSI
    const server = await withTimeout(device.gatt.connect(), 15000, 'GATT');
    let found = null;
    for (const u of UARTS) {
      try { found = { u, s: await withTimeout(server.getPrimaryService(u.svc), 6000, u.name) }; break; } catch {}
    }
    if (!found) throw new Error(t('logNoUart'));
    const { u, s } = found;
    const chars = {};
    for (const id of new Set([u.rx, u.tx])) { try { chars[id] = await s.getCharacteristic(id); } catch {} }
    // On choisit selon les propriétés réelles (notify / write), avec repli sur le choix du C#
    const all = Object.values(chars);
    const canNotify = c => c.properties.notify || c.properties.indicate;
    const canWrite = c => c.properties.write || c.properties.writeWithoutResponse;
    notifyChar = (chars[u.rx] && canNotify(chars[u.rx])) ? chars[u.rx] : all.find(canNotify) || chars[u.rx];
    writeChar = (chars[u.tx] && canWrite(chars[u.tx])) ? chars[u.tx] : all.find(canWrite) || chars[u.tx];
    if (!notifyChar || !writeChar) throw new Error(t('logNoUart'));
    notifyChar.removeEventListener('characteristicvaluechanged', onNotify);
    notifyChar.addEventListener('characteristicvaluechanged', onNotify);
    await notifyChar.startNotifications();
    uartName = u.name;
    log(t('logConnected', { l: uartName }));
    rxBuffer = '';
    reconnectDelay = 1000;
    setState('connected');
    rememberDevice();
    keepAwake();
    showInfo();
    readDeviceInfo(server);
    onLinkReady();
  } catch (e) {
    log(t('logFail', { e: e.message }));
    try { device.gatt.disconnect(); } catch {}
    stopTimers();
    if (e.message === t('logNoUart')) { notifyChar = writeChar = null; setState('failed'); return; }  // pas un Inspectra : inutile de réessayer
    if (!userDisconnect) scheduleReconnect(); else setState('failed');
  }
}

function onDisconnected() {

}

async function readDeviceInfo(server) {
  try {
    const s = await server.getPrimaryService('device_information');
    const map = { manufacturer_name_string: 'Fabricant', model_number_string: 'Modèle', firmware_revision_string: 'Firmware' };

function fmtDistEst(d) {

// RSSI via publicités Bluetooth -> distance (log-distance path loss). Beaucoup d'appareils
// cessent d'émettre des publicités une fois connectés : dans ce cas la distance reste vide.
async function startRssi() {
  stopRssi();
  if (!device || !device.watchAdvertisements) return;
  try {
    advAbort = new AbortController();
    device.addEventListener('advertisementreceived', onAdv);
    await device.watchAdvertisements({ signal: advAbort.signal });

  const tx = (typeof e.txPower === 'number') ? e.txPower : RSSI_TX;
  insp.dist = Math.pow(10, (tx - rssiEwma) / (10 * RSSI_N));

   ===================================================================== */
let txChain = Promise.resolve(), txPending = 0;

  const data = new TextEncoder().encode(cmd + '\r');
  const c = writeChar;
  txPending++;

     H51 + 8 hexa : n° de série      H73 + 2(4) hexa : niveau batterie

  rxBuffer = parts.pop();

    if (!m) { if (s.length > 2) logRaw('? ' + s); return; }
    const code = m[2].toUpperCase();
    let n = DATA_LEN[code];
    if (n === undefined) { handleFrame(m[1].toUpperCase(), code, s.slice(3), s); return; }
    if (code === '73' && s.length < 7) n = 2;
    let frame = s.slice(0, 3 + n);
    const rest = s.slice(3 + n);
    // plusieurs trames collées (cas vu sur le port série) : on découpe selon la longueur connue
    if (rest && !/^[MHIAV][0-9A-F]{2}/i.test(rest)) { frame = s; s = ''; } else s = rest;

    if (!isHex(hex)) return;

  }
  logRaw(raw);

  last = f;

/* =====================================================================
   Historique des mesures : revue dans le temps + lien avec la carte
   ===================================================================== */
const liveSamples = [];                 // mesures de la session { t, v, lat, lon, acc }
const LIVE_MAX = 80000;                 // ≈ 4 h à 5 mesures/s
const GAP_MS = 3000;                    // trou dans la courbe si pas de mesure pendant 3 s
const chart = { live: true, end: 0, span: 60000, sel: null, viewStart: 0, viewEnd: 0, minEnd: 0, maxEnd: 0 };

function recordSample(f) {
  const smp = { t: f.t, v: f.conc };
  if (lastPos && f.t - lastPos.t < 15000) { smp.lat = lastPos.lat; smp.lon = lastPos.lon; smp.acc = lastPos.acc; }
  liveSamples.push(smp);
  if (liveSamples.length > LIVE_MAX) liveSamples.splice(0, liveSamples.length - LIVE_MAX);
  if (mission) {                         // mission : 1 point par seconde (le plus fort)
    const ms = mission.samples || (mission.samples = []), l = ms[ms.length - 1];
    if (l && Math.floor(l.t / 1000) === Math.floor(smp.t / 1000)) { if (smp.v > l.v) Object.assign(l, smp); }

}
const chartData = () => shownMission ? (shownMission.samples || []) : liveSamples;
function lowerBound(a, tt) { let lo = 0, hi = a.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (a[mid].t < tt) lo = mid + 1; else hi = mid; } return lo; }

const fmtHM = tt => new Date(tt).toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit', second: '2-digit' });

function drawChart() {
  const cv = $('chart'), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  const first = data.length ? data[0].t : now, lastT = data.length ? data[data.length - 1].t : now;

    g.font = '600 11px system-ui';
    const tw = g.measureText(lbl).width + 8;
    g.fillStyle = 'rgba(15,23,42,.85)'; g.fillRect(w - tw - 2, yy - 15, tw, 14);
    g.fillStyle = '#f87171'; g.textAlign = 'right'; g.fillText(lbl, w - 6, yy - 4);
    g.textAlign = 'left';

    g.fillStyle = '#facc15'; g.beginPath(); g.arc(x, y, 5, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#0f172a'; g.lineWidth = 2; g.stroke();

  sl.disabled = !(maxEnd > minEnd);

  document.querySelectorAll('.zooms button').forEach(bt => bt.classList.toggle('on', +bt.dataset.span === chart.span));
}

function selectSample(smp, center) {
  chart.sel = smp;
  const info = $('chartInfo');
  if (!smp) { info.textContent = t('chartHint'); mapClearCursor(); return; }
  const pos = smp.lat !== undefined ? `${smp.lat.toFixed(6)}, ${smp.lon.toFixed(6)} (± ${smp.acc} m)` : t('posUnknown');

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  trackLine = L.polyline([], { color: '#0284c7', weight: 5, opacity: .9 }).addTo(map);
  map.on('click', e => {
    const data = chartData();
    if (!data.length) return;
    const cp = map.latLngToContainerPoint(e.latlng);
    let best = null, bd = Infinity;
    for (const p of data) {
      if (p.lat === undefined) continue;
      const q = map.latLngToContainerPoint([p.lat, p.lon]), dd = (q.x - cp.x) ** 2 + (q.y - cp.y) ** 2;
      if (dd < bd || (dd === bd && best && p.t > best.t)) { bd = dd; best = p; }
    }
    if (!best || bd > 30 * 30) return;
    if (chart.live) chart.live = false;
    if (best.t < chart.viewStart || best.t > chart.viewEnd || !chart.end) chart.end = best.t + (chart.span || 0) / 2;
    selectSample(best, false);
  });
  layerAlarms = L.layerGroup().addTo(map);
  layerIndices = L.layerGroup().addTo(map);
  layerAnnots = L.layerGroup().addTo(map);
  map.on('dragstart', () => { follow = false; renderMapButtons(); });
  renderMapButtons();
}

function mapUpdateMe() {
  if (!map || !lastPos) return;
  const ll = [lastPos.lat, lastPos.lon];
  if (!meMarker) {
    meAcc = L.circle(ll, { radius: lastPos.acc, color: '#38bdf8', weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
    meMarker = L.circleMarker(ll, { radius: 8, color: '#fff', weight: 2.5, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
    if (follow && !shownMission) map.setView(ll, 18);
  } else {
    meMarker.setLatLng(ll);
    meAcc.setLatLng(ll).setRadius(lastPos.acc);
    if (follow && !shownMission) map.panTo(ll, { animate: true });
  }
}

function mapRenderMission(force) {
  if (!map) return;
  const m = shownMission || mission;
  const key = m ? `${m.id}-${m.track.length}-${m.alarms.length}-${m.indices.length}-${(m.annotations||[]).length}-${m.alarms.map(a => a.indice ? 1 : 0).join('')}` : '';
  if (!force && key === mapKey) return;
  mapKey = key;
  trackLine.setLatLngs(m ? m.track.map(p => [p.lat, p.lon]) : []);
  layerAlarms.clearLayers();
  layerIndices.clearLayers();
  layerAnnots.clearLayers();
  if (!m) return;
  const u = UNIT;   // l'Inspectra mesure en ppm (les missions v1.0/1.1 avaient « ppm·m » par erreur)
  m.alarms.filter(a => a.pos && !a.indice).forEach(a =>
    L.circleMarker([a.pos.lat, a.pos.lon], { radius: 7, color: '#fff', weight: 2, fillColor: '#ea580c', fillOpacity: 1 })
      .bindPopup(`<b>${t('alarmN', { n: a.n })}</b><br>${fmtTime(a.t)}<br><b style="color:#dc2626">${fmt(a.conc)} ${u}</b>`)
      .addTo(layerAlarms));
  m.indices.filter(i => i.pos).forEach(i =>
    L.marker([i.pos.lat, i.pos.lon], { icon: L.divIcon({ className: 'pin', html: String(i.n), iconSize: [28, 28], iconAnchor: [14, 14] }) })
      .bindPopup(`<b>${t('indiceN', { n: i.n })}</b> · ${fmtTime(i.t)}<br><b style="color:#dc2626">${fmt(i.conc)} ${u}</b>` +
        (i.note ? `<br>${esc(i.note)}` : '') +
        (i.photos.length ? `<br><img src="${i.photos[0].data}" style="width:170px;border-radius:6px;margin-top:6px">` : ''),
        { maxWidth: 200 })
      .addTo(layerIndices));
  (m.annotations || []).filter(an => an.pos).forEach(an =>   // annotations : repère bleu « A », distinct des indices (rouges)
    L.marker([an.pos.lat, an.pos.lon], { icon: L.divIcon({ className: 'pin annot', html: 'A' + an.n, iconSize: [28, 28], iconAnchor: [14, 14] }) })
      .bindPopup(`<b>${t('annotN', { n: an.n })}</b> · ${fmtTime(an.t)}` +
        (an.note ? `<br>${esc(an.note)}` : '') +
        (an.photos.length ? `<br><img src="${an.photos[0].data}" style="width:170px;border-radius:6px;margin-top:6px">` : ''),
        { maxWidth: 200 })
      .addTo(layerAnnots));
}

function missionOnFrame(f) {
  if (!mission) return;
  if (f.conc > mission.maxConc) mission.maxConc = f.conc;
  if (!isAlarmFrame(f)) return;
  const a = mission.alarms[mission.alarms.length - 1];
  const rearm = a && a.indice && f.t - (a.indiceT || 0) > REARM_MS;
  if (!a || f.t - a.lastT > ALARM_GAP_MS || rearm) {
    mission.alarms.push({ n: mission.alarms.length + 1, t: f.t, lastT: f.t, conc: f.conc,
      pos: lastPos ? { ...lastPos } : null, indice: null });
    log(t('logAlarm', { n: mission.alarms.length, c: `${fmt(f.conc)} ${UNIT}` }));
    alertUser();
    scheduleSave(true);
  } else {
    a.lastT = f.t;
    if (f.conc > a.conc) { a.conc = f.conc; if (lastPos) a.pos = { ...lastPos }; }
    scheduleSave();
  }
  renderMission();
}

const pendingAlarm = () => {

async function fileToJpeg(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error(t('badFormat'))); i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * s), h = Math.round(img.naturalHeight * s);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    return { data: cv.toDataURL('image/jpeg', 0.8), w, h };
  } finally { URL.revokeObjectURL(url); }
}

   Rapport PDF : télécharger ou envoyer
   ===================================================================== */
let report = null;
function reportName(m) {
  const d = new Date(m.start), p = n => String(n).padStart(2, '0');
  const slug = m.name.replace(/ß/g, 'ss').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, '').slice(0, 40);
  return `${t('reportFile')}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}h${p(d.getMinutes())}${slug ? '_' + slug : ''}.pdf`;
}
async function showReport(m) {
  report = null;
  $('rInfo').innerHTML = `<b>${esc(m.name)}</b><br>${t(navigator.onLine !== false ? 'generatingMap' : 'generating')}`;
  ['btnShare', 'btnDownload'].forEach(id => $(id).disabled = true);
  $('btnResend').hidden = true;
  openModal('dlgReport');
  try {
    const bytes = await buildReport(m);
    report = { file: new File([bytes], reportName(m), { type: 'application/pdf' }), m };
    $('rInfo').innerHTML = `<b>${esc(m.name)}</b><br>${fmtDate(m.start)} · ${t('counts', { a: m.alarms.length, i: m.indices.length })}<br>${Math.max(1, Math.round(bytes.length / 1024))} Ko`;
    $('btnDownload').disabled = false;
    renderShareState();
  } catch (e) {
    log(t('logReportErr', { e: e.message }));
    $('rInfo').textContent = t('reportErr', { e: e.message });
  }
}
$('btnDownload').onclick = () => {
  const url = URL.createObjectURL(report.file);
  const a = document.createElement('a');
  a.href = url; a.download = report.file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
};
const canShareFile = () => !!(navigator.canShare && navigator.canShare({ files: [report.file] }));
function renderShareState() {
  const m = report.m, b = $('btnShare'), r = $('btnResend');
  if (m.sentAt) {
    b.textContent = t('alreadySent', { d: fmtDate(m.sentAt) });
    b.disabled = true;
    r.hidden = !canShareFile();
  } else {
    b.textContent = t('send');
    b.disabled = !canShareFile();
    r.hidden = true;
  }
}
async function shareReport() {
  const m = report.m;
  $('btnShare').disabled = true;
  try {
    await navigator.share({ files: [report.file], title: t('shareTitle', { n: m.name }),
      text: t('shareText', { n: m.name, d: fmtDate(m.start) }) });
    m.sentAt = Date.now();
    m.sentCount = (m.sentCount || 0) + 1;
    await db.put(m).catch(() => {});
    log(t('logSent', { n: m.name }));
    renderMissions();
  } catch (e) { if (e.name !== 'AbortError') log(t('logShareErr', { e: e.message })); }
  renderShareState();
}
$('btnShare').onclick = shareReport;
$('btnResend').onclick = () => {
  if (confirm(t('confirmResend', { d: fmtDate(report.m.sentAt) }))) shareReport();
};

/* ---------- Mini générateur PDF (texte, dessins, photos JPEG, liens) ---------- */
const PDF = (() => {
  const HR = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const HB = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  const WIN = { 0x20AC:0x80, 0x201A:0x82, 0x201E:0x84, 0x2026:0x85, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94,
    0x2022:0x95, 0x2013:0x96, 0x2014:0x97, 0x0152:0x8C, 0x0153:0x9C, 0x202F:0x20, 0x00A0:0x20, 0x2009:0x20, 0x2265:0x3E };
  const n = v => (Math.round(v * 100) / 100).toString();
  const encChar = ch => { const c = ch.codePointAt(0); return c < 256 && c !== 0xA0 ? c : (WIN[c] ?? 0x3F); };
  const enc = s => [...String(s)].map(ch => { const c = encChar(ch), t = String.fromCharCode(c); return c === 0x28 || c === 0x29 || c === 0x5C ? '\\' + t : t; }).join('');
  const charW = (ch, bold) => {
    let c = ch.codePointAt(0);
    if (c === 0x202F || c === 0xA0 || c === 0x2009) c = 32;
    if (c < 32 || c > 126) {
      const base = ch.normalize('NFD').codePointAt(0);
      if (base >= 32 && base <= 126) c = base;
      else return { 0xB7: 278, 0xB0: 400, 0x2019: bold ? 278 : 222, 0x2014: 1000, 0x2013: 556, 0x2026: 1000 }[c] ?? 556;
    }
    return (bold ? HB : HR)[c - 32];
  };
  const width = (s, size, bold) => [...String(s)].reduce((w, ch) => w + charW(ch, bold), 0) * size / 1000;
  const bin = s => { const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xFF; return b; };
  const rgb = c => c.map(v => n(v / 255)).join(' ');

  function create() {
    const W = 595.28, H = 841.89, pages = [], images = [];
    let cur = null;
    return {
      W, H, pages, width,
      addPage() { cur = { ops: [], links: [] }; pages.push(cur); return cur; },
      setPage(p) { cur = p; },
      text(x, y, s, o = {}) {
        const { size = 10, bold = false, color = [15, 23, 42] } = o;
        cur.ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${rgb(color)} rg ${n(x)} ${n(H - y)} Td (${enc(s)}) Tj ET`);
      },
      rect(x, y, w, h, o = {}) {
        const { fill, stroke, lw = 1 } = o;
        cur.ops.push(`${fill ? rgb(fill) + ' rg ' : ''}${stroke ? rgb(stroke) + ' RG ' + n(lw) + ' w ' : ''}${n(x)} ${n(H - y - h)} ${n(w)} ${n(h)} re ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`);
      },
      line(pts, color, lw = 1) {
        if (pts.length < 2) return;
        cur.ops.push(`${rgb(color)} RG ${n(lw)} w 1 J 1 j ` + pts.map((p, i) => `${n(p[0])} ${n(H - p[1])} ${i ? 'l' : 'm'}`).join(' ') + ' S');
      },
      poly(pts, fill) { cur.ops.push(`${rgb(fill)} rg ` + pts.map((p, i) => `${n(p[0])} ${n(H - p[1])} ${i ? 'l' : 'm'}`).join(' ') + ' h f'); },
      circle(cx, cy, r, o = {}) {
        const { fill, stroke, lw = 1 } = o, k = 0.5523 * r, y = H - cy;
        cur.ops.push(`${fill ? rgb(fill) + ' rg ' : ''}${stroke ? rgb(stroke) + ' RG ' + n(lw) + ' w ' : ''}` +
          `${n(cx + r)} ${n(y)} m ${n(cx + r)} ${n(y + k)} ${n(cx + k)} ${n(y + r)} ${n(cx)} ${n(y + r)} c ` +
          `${n(cx - k)} ${n(y + r)} ${n(cx - r)} ${n(y + k)} ${n(cx - r)} ${n(y)} c ` +
          `${n(cx - r)} ${n(y - k)} ${n(cx - k)} ${n(y - r)} ${n(cx)} ${n(y - r)} c ` +
          `${n(cx + k)} ${n(y - r)} ${n(cx + r)} ${n(y - k)} ${n(cx + r)} ${n(y)} c ${fill && stroke ? 'B' : fill ? 'f' : 'S'}`);
      },
      jpeg(dataUrl, w, h) {
        const im = { name: 'Im' + (images.length + 1), bytes: bin(atob(dataUrl.split(',')[1])), w, h };
        images.push(im); return im;
      },
      image(im, x, y, w, h) { cur.ops.push(`q ${n(w)} 0 0 ${n(h)} ${n(x)} ${n(H - y - h)} cm /${im.name} Do Q`); },
      link(x, y, w, h, url) { cur.links.push({ x, y, w, h, url }); },
      build(title) {
        const chunks = []; let len = 0; const offs = [];
        const push = s => { const b = typeof s === 'string' ? bin(s) : s; chunks.push(b); len += b.length; };
        let id = 5;
        images.forEach(im => im.id = id++);
        pages.forEach(p => { p.id = id++; p.cid = id++; p.ann = p.links.map(() => id++); });
        const infoId = id, total = id;
        const obj = (oid, parts) => { offs[oid] = len; push(`${oid} 0 obj\n`); [].concat(parts).forEach(push); push('\nendobj\n'); };
        push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
        obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
        obj(2, `<< /Type /Pages /Kids [${pages.map(p => p.id + ' 0 R').join(' ')}] /Count ${pages.length} >>`);
        obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
        obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
        images.forEach(im => obj(im.id, [`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`, im.bytes, '\nendstream']));
        const xo = images.length ? `/XObject << ${images.map(im => `/${im.name} ${im.id} 0 R`).join(' ')} >>` : '';
        pages.forEach(p => {
          obj(p.id, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${n(W)} ${n(H)}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> ${xo} >> /Contents ${p.cid} 0 R${p.ann.length ? ` /Annots [${p.ann.map(a => a + ' 0 R').join(' ')}]` : ''} >>`);
          const content = p.ops.join('\n');
          obj(p.cid, [`<< /Length ${content.length} >>\nstream\n`, content, '\nendstream']);
          p.links.forEach((l, i) => obj(p.ann[i], `<< /Type /Annot /Subtype /Link /Rect [${n(l.x)} ${n(H - l.y - l.h)} ${n(l.x + l.w)} ${n(H - l.y)}] /Border [0 0 0] /A << /S /URI /URI (${enc(l.url)}) >> >>`));
        });
        obj(infoId, `<< /Title (${enc(title.replace(/[–—]/g, '-').replace(/[’]/g, "'"))}) /Producer (Inspectra Web v${APP_VERSION}) >>`);
        const xref = len;
        let x = `xref\n0 ${total + 1}\n0000000000 65535 f \n`;
        for (let i = 1; i <= total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
        push(x);
        push(`trailer\n<< /Size ${total + 1} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
        const out = new Uint8Array(len); let o = 0;
        chunks.forEach(c => { out.set(c, o); o += c.length; });
        return out;
      }
    };
  }
  return { create };
})();

/* ---------- Fond de carte OpenStreetMap pour le PDF ---------- */
const mercX = lon => (lon + 180) / 360;
const mercY = lat => { const r = lat * Math.PI / 180; return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2; };

async function renderBasemap(cx, cy, Sn, wPt, hPt) {
  if (navigator.onLine === false) return null;
  try {
    const R = 2.5;
    const W = Math.round(wPt * R), H = Math.round(hPt * R);
    const pxPerUnit = Sn * R;
    const z = Math.max(0, Math.min(19, Math.floor(Math.log2(pxPerUnit / 256))));
    const n = 2 ** z, k = pxPerUnit / (256 * n);
    const x0 = cx - W / 2 / pxPerUnit, y0 = cy - H / 2 / pxPerUnit;
    const tx0 = Math.floor(x0 * n), ty0 = Math.floor(y0 * n);
    const tx1 = Math.floor((x0 + W / pxPerUnit) * n), ty1 = Math.floor((y0 + H / pxPerUnit) * n);
    if ((tx1 - tx0 + 1) * (ty1 - ty0 + 1) > 60) return null;

    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#e5e7eb'; g.fillRect(0, 0, W, H);
    const timeout = ms => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
    const jobs = [];
    for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
      if (ty < 0 || ty >= n) continue;
      const wx = ((tx % n) + n) % n;
      jobs.push(Promise.race([
        fetch(`https://tile.openstreetmap.org/${z}/${wx}/${ty}.png`, { mode: 'cors' })
          .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
          .then(b => createImageBitmap(b)),
        timeout(8000)
      ]).then(img => {
        const size = 256 * k;
        g.drawImage(img, Math.round((tx / n - x0) * pxPerUnit), Math.round((ty / n - y0) * pxPerUnit), Math.ceil(size), Math.ceil(size));
        return true;
      }).catch(() => false));
    }
    const ok = (await Promise.all(jobs)).filter(Boolean).length;
    if (!ok) { log(t('logOsmNone')); return null; }
    return { data: cv.toDataURL('image/jpeg', 0.85), w: W, h: H };
  } catch (e) {
    log(t('logOsm', { e: e.message }));
    return null;
  }
}

/* ---------- Contenu du rapport ---------- */
async function buildReport(m, opts = {}) {
  const d = PDF.create(), M = 40, PW = d.W - 2 * M;
  const C = { ink: [15, 23, 42], mute: [100, 116, 139], line: [203, 213, 225], soft: [241, 245, 249],
    navy: [15, 23, 42], blue: [2, 132, 199], red: [220, 38, 38], orange: [234, 88, 12], green: [22, 163, 74], indigo: [37, 99, 235], white: [255, 255, 255] };
  const unit = UNIT;   // ppm pour toutes les missions, y compris les anciennes
  let y = 0;

  const newPage = () => {
    d.addPage();
    if (d.pages.length > 1) {
      d.text(M, 28, t('rTitle'), { size: 8, bold: true, color: C.mute });
      const nm = m.name.length > 70 ? m.name.slice(0, 67) + '…' : m.name;
      d.text(d.W - M - d.width(nm, 8), 28, nm, { size: 8, color: C.mute });
      d.line([[M, 34], [d.W - M, 34]], C.line, 0.5);
      y = 52;
    }
  };
  const ensure = h => { if (y + h > d.H - 50) newPage(); };
  const wrap = (s, w, size, bold) => {
    const out = [];
    String(s).split('\n').forEach(par => {
      let line = '';
      par.split(/\s+/).forEach(word => {
        const tt = line ? line + ' ' + word : word;
        if (d.width(tt, size, bold) <= w) line = tt;
        else {
          if (line) out.push(line);
          while (d.width(word, size, bold) > w) { let k = word.length; while (k > 1 && d.width(word.slice(0, k), size, bold) > w) k--; out.push(word.slice(0, k)); word = word.slice(k); }
          line = word;
        }
      });
      out.push(line);
    });
    return out;
  };
  const para = (s, o = {}) => {
    const { size = 10, bold = false, color = C.ink, x = M, w = PW, lh = 1.4 } = o;
    wrap(s, w, size, bold).forEach(l => { ensure(size * lh); d.text(x, y + size, l, { size, bold, color }); y += size * lh; });
  };
  const heading = s => { ensure(60); y += 14; d.text(M, y + 13, s, { size: 13, bold: true }); y += 20; d.line([[M, y], [d.W - M, y]], C.line, 0.8); y += 10; };

  // ---- En-tête ----
  newPage();
  d.rect(0, 0, d.W, 96, { fill: C.navy });
  d.text(M, 42, t('rTitle'), { size: 20, bold: true, color: C.white });
  wrap(m.name, PW, 12, false).slice(0, 2).forEach((l, i) => d.text(M, 64 + i * 15, l, { size: 12, color: [203, 213, 225] }));
  y = 116;

  // ---- Synthèse ----
  const track = m.track || [];
  const dev = m.device || {};
  const stats = [
    [t('maxConc'), `${fmt(m.maxConc || 0)} ${unit}`, m.alarms.length ? C.red : C.ink],
    [t('alarms'), String(m.alarms.length), m.alarms.length ? C.red : C.ink],
    [t('indices'), String(m.indices.length), C.ink],
    [t('distance'), fmtDist(trackDist(track)), C.ink]
  ];
  const bw = (PW - 30) / 4;
  stats.forEach(([k, v, col], i) => {
    const x = M + i * (bw + 10);
    d.rect(x, y, bw, 52, { fill: C.soft });
    d.text(x + 10, y + 18, k, { size: 8, color: C.mute });
    d.text(x + 10, y + 40, v, { size: 14, bold: true, color: col });
  });
  y += 70;

  const rows = [
    [t('rMission'), m.name],
    [t('operator'), m.operator || '—'],
    [t('rStart'), fmtDate(m.start)],
    [t('rEnd'), m.end ? fmtDate(m.end) : '—'],
    [t('duration'), m.end ? fmtDurLong(m.end - m.start) : '—'],
    [t('dev.Appareil'), dev.Appareil || '—'],
    [t('dev.Série'), dev['Série'] || '—'],
  ];
  if (dev.Liaison) rows.push([t('dev.Liaison'), dev.Liaison]);
  if (dev.Fabricant || dev['Modèle']) rows.push([t('rMakerModel'), [dev.Fabricant, dev['Modèle']].filter(Boolean).join(' / ')]);
  if (dev.Firmware) rows.push([t('rFwSw'), dev.Firmware]);
  rows.push([t('rDetection'), t('detUser', { v: `${fmt(m.threshold)} ${unit}` })]);
  rows.push([t('rGpsPts'), String(track.length)]);
  rows.forEach(([k, v], i) => {
    const lines = wrap(v, PW - 150, 10, false);
    const h = lines.length * 14 + 8;
    ensure(h);
    if (i % 2 === 0) d.rect(M, y, PW, h, { fill: C.soft });
    d.text(M + 8, y + 15, k, { size: 9, color: C.mute });
    lines.forEach((l, j) => d.text(M + 150, y + 15 + j * 14, l, { size: 10 }));
    y += h;
  });

  // ---- Plan du parcours ----
  heading(t('plan'));
  const pts = [...track, ...m.alarms.filter(a => a.pos).map(a => a.pos), ...m.indices.filter(i => i.pos).map(i => i.pos), ...(m.annotations || []).filter(a => a.pos).map(a => a.pos)];
  if (!pts.length) {
    para(t('noGps'), { color: C.mute });
  } else {
    const BH = 300;
    ensure(BH + 40);
    const bx = M, by = y, bwid = PW, pad = 26;
    const lat0 = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
    const metersPerUnit = 40075016.686 * Math.cos(lat0 * Math.PI / 180);
    const P = p => ({ x: mercX(p.lon), y: mercY(p.lat) });
    const xy = pts.map(P);
    const minX = Math.min(...xy.map(p => p.x)), maxX = Math.max(...xy.map(p => p.x));
    const minY = Math.min(...xy.map(p => p.y)), maxY = Math.max(...xy.map(p => p.y));
    const minExt = 40 / metersPerUnit;
    const Sn = Math.min((bwid - 2 * pad) / Math.max(maxX - minX, minExt), (BH - 2 * pad) / Math.max(maxY - minY, minExt));
    const S = Sn / metersPerUnit;
    const cx0 = (minX + maxX) / 2, cy0 = (minY + maxY) / 2;
    const toPage = p => { const q = P(p); return [bx + bwid / 2 + (q.x - cx0) * Sn, by + BH / 2 + (q.y - cy0) * Sn]; };

    const base = opts.basemap !== false ? await renderBasemap(cx0, cy0, Sn, bwid, BH) : null;
    if (base) {
      d.image(d.jpeg(base.data, base.w, base.h), bx, by, bwid, BH);
      d.rect(bx, by, bwid, BH, { stroke: C.line, lw: 0.8 });
      const attr = t('osmAttr');
      const aw = d.width(attr, 6.5);
      d.rect(bx + bwid - aw - 8, by + BH - 11, aw + 8, 11, { fill: C.white });
      d.text(bx + bwid - aw - 4, by + BH - 3, attr, { size: 6.5, color: C.mute });
      d.link(bx + bwid - aw - 8, by + BH - 11, aw + 8, 11, 'https://www.openstreetmap.org/copyright');
    } else {
      d.rect(bx, by, bwid, BH, { fill: [248, 250, 252], stroke: C.line, lw: 0.8 });
      for (let i = 1; i < 6; i++) d.line([[bx + bwid * i / 6, by], [bx + bwid * i / 6, by + BH]], [226, 232, 240], 0.4);
      for (let i = 1; i < 5; i++) d.line([[bx, by + BH * i / 5], [bx + bwid, by + BH * i / 5]], [226, 232, 240], 0.4);
    }

    const tr = track.map(toPage);
    if (tr.length > 1 && base) d.line(tr, C.white, 4.5);
    if (tr.length > 1) d.line(tr, C.blue, 2.5);
    if (tr.length) d.circle(tr[0][0], tr[0][1], 5, { fill: C.green, stroke: C.white, lw: 1.2 });
    if (tr.length > 1) { const e = tr[tr.length - 1]; d.rect(e[0] - 4.5, e[1] - 4.5, 9, 9, { fill: C.navy, stroke: C.white, lw: 1.2 }); }
    m.alarms.filter(a => a.pos && !a.indice).forEach(a => { const p = toPage(a.pos); d.circle(p[0], p[1], 4, { fill: C.orange, stroke: C.white, lw: 1 }); });
    m.indices.filter(i => i.pos).forEach(i => {
      const p = toPage(i.pos), lbl = String(i.n), w = d.width(lbl, 8, true);
      d.circle(p[0], p[1], 8, { fill: C.red, stroke: C.white, lw: 1.5 });
      d.text(p[0] - w / 2, p[1] + 3, lbl, { size: 8, bold: true, color: C.white });
    });
    (m.annotations || []).filter(a => a.pos).forEach(a => {   // annotations : repère bleu « A »
      const p = toPage(a.pos), lbl = 'A' + a.n, w = d.width(lbl, 7, true);
      d.circle(p[0], p[1], 8, { fill: C.indigo, stroke: C.white, lw: 1.5 });
      d.text(p[0] - w / 2, p[1] + 2.6, lbl, { size: 7, bold: true, color: C.white });
    });

    const target = (bwid / 4) / S;
    const nice = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000, 20000, 50000].reduce((a, b) => b <= target ? b : a, 1);
    const L = nice * S, sx = bx + 14, sy = by + BH - 12, lbl = nice >= 1000 ? nice / 1000 + ' km' : nice + ' m';
    d.rect(sx - 6, sy - 14, L + 18 + d.width(lbl, 8), 20, { fill: C.white });
    d.line([[sx, sy - 4], [sx, sy], [sx + L, sy], [sx + L, sy - 4]], C.ink, 1);
    d.text(sx + L + 6, sy, lbl, { size: 8 });
    const nx = bx + bwid - 22, ny = by + 14;
    d.poly([[nx, ny], [nx - 6, ny + 16], [nx, ny + 12], [nx + 6, ny + 16]], C.ink);
    d.text(nx - d.width(t('north'), 8, true) / 2, ny + 28, t('north'), { size: 8, bold: true });
    y = by + BH + 12;

    let lx = M;
    const leg = (draw, label) => { draw(lx + 5, y + 5); d.text(lx + 14, y + 8.5, label, { size: 8.5, color: C.mute }); lx += 26 + d.width(label, 8.5); };
    leg((x, yy) => d.line([[x - 5, yy], [x + 5, yy]], C.blue, 2), t('legTrack'));
    leg((x, yy) => d.circle(x, yy, 4, { fill: C.green }), t('legStart'));
    leg((x, yy) => d.rect(x - 4, yy - 4, 8, 8, { fill: C.navy }), t('legEnd'));
    leg((x, yy) => d.circle(x, yy, 4, { fill: C.orange }), t('legAlarm'));
    leg((x, yy) => d.circle(x, yy, 5, { fill: C.red }), t('indice'));
    leg((x, yy) => d.circle(x, yy, 5, { fill: C.indigo }), t('legAnnot'));
    y += 22;
  }

  // ---- Alarmes ----
  heading(t('alarmsDetected', { n: m.alarms.length }));
  if (!m.alarms.length) para(t('noAlarms'), { color: C.mute });
  else {
    const cols = [[M + 6, t('colN')], [M + 36, t('time')], [M + 100, t('concentration')], [M + 200, t('colPos')], [M + 450, t('indice')]];
    const head = () => {
      d.rect(M, y, PW, 20, { fill: C.soft });
      cols.forEach(([x, s]) => d.text(x, y + 13.5, s, { size: 8.5, bold: true, color: C.mute }));
      y += 20;
    };
    head();
    m.alarms.forEach(a => {
      if (y + 20 > d.H - 50) { newPage(); head(); }
      d.text(cols[0][0], y + 13.5, String(a.n), { size: 9.5 });
      d.text(cols[1][0], y + 13.5, fmtTime(a.t), { size: 9.5 });
      d.text(cols[2][0], y + 13.5, `${fmt(a.conc)} ${unit}`, { size: 9.5, bold: true, color: C.red });
      if (a.pos) {
        const ps = `${fmtPos(a.pos)} (± ${a.pos.acc} m)`;
        d.text(cols[3][0], y + 13.5, ps, { size: 9.5, color: C.blue });
        d.link(cols[3][0], y + 3, d.width(ps, 9.5), 14, mapUrl(a.pos));
      } else d.text(cols[3][0], y + 13.5, t('noPos'), { size: 9.5, color: C.mute });
      d.text(cols[4][0], y + 13.5, a.indice ? t('nShort', { n: a.indice }) : '—', { size: 9.5 });
      y += 20;
      d.line([[M, y], [d.W - M, y]], C.line, 0.5);
    });
  }

  // ---- Indices ----
  heading(t('indicesTitle', { n: m.indices.length }));
  if (!m.indices.length) para(t('noIndices'), { color: C.mute });
  m.indices.forEach(ind => {
    ensure(110);
    d.rect(M, y, PW, 26, { fill: [254, 242, 242] });
    d.circle(M + 16, y + 13, 9, { fill: C.red });
    const nb = String(ind.n);
    d.text(M + 16 - d.width(nb, 9, true) / 2, y + 16.2, nb, { size: 9, bold: true, color: C.white });
    d.text(M + 32, y + 17, t('indiceN', { n: ind.n }), { size: 11.5, bold: true });
    const right = `${fmt(ind.conc)} ${unit}`;
    d.text(d.W - M - 10 - d.width(right, 11.5, true), y + 17, right, { size: 11.5, bold: true, color: C.red });
    y += 34;
    const kv = (k, v, link) => {
      const lines = wrap(v, PW - 100, 10, false);
      ensure(lines.length * 14 + 4);
      d.text(M + 8, y + 10, k, { size: 9, color: C.mute });
      lines.forEach((l, j) => {
        d.text(M + 100, y + 10 + j * 14, l, { size: 10, color: link ? C.blue : C.ink });
        if (link) d.link(M + 100, y + j * 14, d.width(l, 10), 13, link);
      });
      y += lines.length * 14 + 4;
    };
    kv(t('dateTime'), t('at', { d: new Date(ind.t).toLocaleDateString(LOCALE), t: fmtTime(ind.t) }));
    kv(t('alarm'), t('nShort', { n: ind.alarm }));
    if (ind.pos) kv(t('position'), t('openMap', { p: fmtPos(ind.pos), a: ind.pos.acc }), mapUrl(ind.pos));
    else kv(t('position'), t('unavailable'));
    kv(t('note'), ind.note || '—');
    const pw = (PW - 12) / 2;
    for (let i = 0; i < ind.photos.length; i += 2) {
      const row = ind.photos.slice(i, i + 2).map(ph => {
        let w = pw, h = pw * ph.h / ph.w;
        if (h > 230) { h = 230; w = h * ph.w / ph.h; }
        return { ph, w, h };
      });
      const rh = Math.max(...row.map(r => r.h));
      y += 6;
      ensure(rh + 8);
      row.forEach((r, j) => {
        const x = M + j * (pw + 12) + (pw - r.w) / 2;
        d.image(d.jpeg(r.ph.data, r.ph.w, r.ph.h), x, y, r.w, r.h);
        d.rect(x, y, r.w, r.h, { stroke: C.line, lw: 0.5 });
      });
      y += rh + 4;
    }
    y += 16;
  });

  // ---- Annotations ----
  const annots = m.annotations || [];
  heading(t('annotationsTitle', { n: annots.length }));
  if (!annots.length) para(t('noAnnotations'), { color: C.mute });
  annots.forEach(an => {
    ensure(90);
    d.rect(M, y, PW, 26, { fill: [239, 246, 255] });
    d.circle(M + 16, y + 13, 9, { fill: C.indigo });
    const nb = 'A' + an.n;
    d.text(M + 16 - d.width(nb, 8, true) / 2, y + 16.2, nb, { size: 8, bold: true, color: C.white });
    d.text(M + 32, y + 17, t('annotN', { n: an.n }), { size: 11.5, bold: true });
    y += 34;
    const kv = (k, v, link) => {
      const lines = wrap(v, PW - 100, 10, false);
      ensure(lines.length * 14 + 4);
      d.text(M + 8, y + 10, k, { size: 9, color: C.mute });
      lines.forEach((l, j) => {
        d.text(M + 100, y + 10 + j * 14, l, { size: 10, color: link ? C.blue : C.ink });
        if (link) d.link(M + 100, y + j * 14, d.width(l, 10), 13, link);
      });
      y += lines.length * 14 + 4;
    };
    kv(t('dateTime'), t('at', { d: new Date(an.t).toLocaleDateString(LOCALE), t: fmtTime(an.t) }));
    if (an.pos) kv(t('position'), t('openMap', { p: fmtPos(an.pos), a: an.pos.acc }), mapUrl(an.pos));
    else kv(t('position'), t('unavailable'));
    kv(t('note'), an.note || '\u2014');
    const pw = (PW - 12) / 2;
    for (let i = 0; i < an.photos.length; i += 2) {
      const row = an.photos.slice(i, i + 2).map(ph => {
        let w = pw, h = pw * ph.h / ph.w;
        if (h > 230) { h = 230; w = h * ph.w / ph.h; }
        return { ph, w, h };
      });
      const rh = Math.max(...row.map(r => r.h));
      y += 6;
      ensure(rh + 8);
      row.forEach((r, j) => {
        const x = M + j * (pw + 12) + (pw - r.w) / 2;
        d.image(d.jpeg(r.ph.data, r.ph.w, r.ph.h), x, y, r.w, r.h);
        d.rect(x, y, r.w, r.h, { stroke: C.line, lw: 0.5 });
      });
      y += rh + 4;
    }
    y += 16;
  });

  // ---- Pieds de page ----
  const gen = t('generated', { d: fmtDate(Date.now()), v: APP_VERSION });
  d.pages.forEach((p, i) => {
    d.setPage(p);
    d.line([[M, d.H - 34], [d.W - M, d.H - 34]], C.line, 0.5);
    d.text(M, d.H - 22, gen, { size: 7.5, color: C.mute });
    const pg = t('page', { i: i + 1, n: d.pages.length });
    d.text(d.W - M - d.width(pg, 7.5), d.H - 22, pg, { size: 7.5, color: C.mute });
  });
  return d.build(t('shareTitle', { n: m.name }));
}

/* =====================================================================
   Démo (sans appareil) : simule un Inspectra qui répond aux commandes
   ===================================================================== */
const demo = { auto: false, tick: 0, pump: [1, 1], conc: 0 };
const hex = (v, n) => Math.max(0, Math.round(v)).toString(16).toUpperCase().padStart(n, '0');
function demoEmit(s) {                     // découpe en paquets de 20 octets comme sur Android
  setTimeout(() => { for (let i = 0; i < s.length; i += 20) feed(s.slice(i, i + 20)); }, 30);
}
function demoCommand(cmd) {
  const p = demo.pump;
  if (cmd === 'U10') { demo.auto = true; demoEmit('A80\r'); }
  else if (cmd === 'U90') { demo.auto = false; demoEmit('A80\r'); }
  else if (cmd === 'G10') demoEmit('H10' + hex(demo.conc * 10, 8) + '\r');
  else if (cmd === 'G51') demoEmit('H51' + hex(123456, 8) + '\r');
  else if (cmd === 'G73') demoEmit('H7304\r');
  else if (cmd === 'G1B') demoEmit('H1B' + hex(p[0], 2) + hex(p[1], 2) + '\r');
  else if (cmd.startsWith('S1B')) { demo.pump = [parseInt(cmd.slice(3, 5), 16), parseInt(cmd.slice(5, 7), 16)]; demoEmit('I1B' + cmd.slice(3, 7) + '\r'); }
}
function startDemo() {
  setState('demo');
  uartName = 'BGX (simulation)';
  Object.assign(demo, { auto: false, tick: 0, pump: [1, 1] });
  demoTimer = setInterval(() => {
    const k = ++demo.tick;
    const pumping = demo.pump[0] === 1;
    demo.conc = !pumping ? 0 : Math.max(0, k % 80 > 25 && k % 80 < 45 ? 400 + 300 * Math.sin(k / 3) + Math.random() * 80 : Math.random() * 8);
    insp.dist = Math.min(15, Math.max(0.7, (insp.dist || 3) + (Math.random() - 0.5) * 1.1));
    renderDevInfo();   // distance estimée simulée
    if (demo.auto) {
      const f = 'M10' + hex(demo.conc * 10, 8) + '\r';
      if (k % 7 === 0) demoEmit(f + 'M10' + hex(demo.conc * 10, 8) + '\r');   // deux trames collées
      else demoEmit(f);
    }
  }, 200);
  showInfo();
  onLinkReady();
}
function stopDemo() { clearInterval(demoTimer); demoTimer = null; stopTimers(); uartName = ''; insp.dist = null; renderDevInfo(); setState('idle'); }

/* =====================================================================
   Visual_Concentration : téléphone en paysage -> plein écran concentration
   (début du bloc ; pour retirer l'option, supprimer les blocs marqués
   « Visual_Concentration » dans le CSS, le HTML, ici et l'appel dans tick())
   ===================================================================== */
const VC_MQ = matchMedia('(orientation: landscape) and (max-height: 600px)');   // paysage sur téléphone
let vcMinimized = false, vcMode = 'conc';     // 'conc' = chiffre seul, 'map' = carte + concentration en transparence
let mapHome = null;                            // emplacement d'origine de #map dans la page (pour le remettre)
function vcMoveMapToFull() {
  const m = $('map'); if (!m) return;
  if (!mapHome) mapHome = { parent: m.parentNode, next: m.nextSibling };
  if (m.parentNode !== $('vcMapHolder')) $('vcMapHolder').appendChild(m);
  if (map) setTimeout(() => {
    map.invalidateSize();
    if (follow && !shownMission && lastPos) map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 17));
  }, 60);
}
function vcRestoreMap() {
  const m = $('map'); if (!m || !mapHome || m.parentNode !== $('vcMapHolder')) return;
  mapHome.parent.insertBefore(m, mapHome.next);
  if (map) setTimeout(() => map.invalidateSize(), 60);
}
function vcUpdate() {
  const land = VC_MQ.matches;
  if (!land) vcMinimized = false;            // retour en portrait : la prochaine bascule réaffiche le plein écran
  const on = land && !vcMinimized;
  const mapOn = on && vcMode === 'map';
  if (mapOn) vcMoveMapToFull(); else vcRestoreMap();   // la carte est en portrait OU dans le plein écran, jamais aux deux endroits
  $('vcView').hidden = !on;
  $('vcView').classList.toggle('vc-map', mapOn);
  $('vcOpen').hidden = !(land && vcMinimized);
  document.body.classList.toggle('vc-on', on);
  $('vcMap').textContent = t(mapOn ? 'vc.conc' : 'vc.map');
  $('vcLocate').hidden = !mapOn;
  vcRender();
}
function vcRender() {
  if ($('vcView').hidden) return;
  const live = isLive(), fresh = live && last && Date.now() - lastFrame <= MEAS_TIMEOUT_MS;
  const alarm = !!(fresh && isAlarmFrame(last));
  const cTxt = last ? fmt(last.conc) : '—';
  const cCls = (!last ? '' : alarm ? 'alarm' : last.conc > 0 ? 'pos' : 'zero') + (fresh ? '' : ' idle');
  $('vcConc').textContent = cTxt; $('vcConc').className = 'vc-conc ' + cCls;
  $('vcpConc').textContent = cTxt; $('vcpConc').className = 'vcp-conc ' + cCls;
  $('vcView').classList.toggle('alarm', alarm);
  const thr = alarmThreshold();
  const info = esc(t('measure')) + SEP + '<b>' + esc(live ? t(fresh ? 'measLive' : 'measWait') : t('state.' + bleState)) + '</b>' +
    (thr !== null ? ' · ' + esc(t('thr', { v: fmt(thr) })) + (alarm ? SEP + '<b style="color:#fca5a5">' + esc(t('exceeded')) + '</b>' : '') : '');
  $('vcInfo').innerHTML = info; $('vcpInfo').innerHTML = info;
  const pb = $('vcPump');
  pb.textContent = `${t('pump')}${SEP}${insp.pump ? t('pump.' + insp.pump) : '—'} ⟳`;
  pb.disabled = !live;
}
$('vcUnit').textContent = UNIT;
$('vcpUnit').textContent = UNIT;
$('vcLocate').textContent = '📍';
$('vcMin').onclick = () => { vcMinimized = true; vcUpdate(); };     // Réduire (mode gardé)
$('vcOpen').onclick = () => { vcMinimized = false; vcUpdate(); };
$('vcMap').onclick = () => { vcMode = vcMode === 'map' ? 'conc' : 'map'; vcUpdate(); };
$('vcLocate').onclick = () => { $('btnLocate').onclick(); vcMoveMapToFull(); };   // recentre et réactive le suivi
// un seul petit bouton pompe : chaque appui passe à l'allure suivante (Niv. 1 -> Niv. 2 -> Arrêt -> Niv. 1)
$('vcPump').onclick = () => {
  const next = { s1: '0101', s2: '0000', off: '0100', block: '0100' }[insp.pump] || '0100';
  send('S1B' + next);
  setTimeout(() => send('G1B'), 400);
};
VC_MQ.addEventListener ? VC_MQ.addEventListener('change', vcUpdate) : VC_MQ.addListener(vcUpdate);
vcUpdate();
/* ===== Visual_Concentration (fin) ===== */

/* =====================================================================
   Boutons et démarrage
   ===================================================================== */
// (1) filtre sur les services série de l'Inspectra (BGX / NINA)
$('btnConnect').onclick = () => requestDevice({ filters: UARTS.map(u => ({ services: [u.svc] })) });
// Repli : si le module n'annonce pas son service dans la publicité Bluetooth
$('btnConnectAll').onclick = () => requestDevice({ acceptAllDevices: true });
$('btnDisconnect').onclick = disconnect;
$('btnShutdown').onclick = shutdownDevice;
$('btnDemo').onclick = () => demoTimer ? stopDemo() : startDemo();
setState('idle');
renderStatus();
renderMax();
renderDevices();
renderMissions();
initMap();
resumeMission();
try { navigator.permissions.query({ name: 'geolocation' }).then(r => { if (r.state === 'granted') { startGeo(); renderMapButtons(); } }); } catch {}
</script>
